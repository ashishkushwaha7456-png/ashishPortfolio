<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="960" height="1200" role="img" aria-label="Ashish Kumar — MERN stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0%" stop-color="#16132c"/>
      <stop offset="52%" stop-color="#0d1020"/>
      <stop offset="100%" stop-color="#0a0e15"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="74%" cy="12%" r="64%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="10%" cy="66%" r="58%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb" cx="36%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#7c7ff5" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#4c1d95" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0d1020" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="52%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="winBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#131228" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0c1019" stop-opacity="0.92"/>
    </linearGradient>

    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>

    <!-- Bottom of the frame sits under a background gradient + the Mission
         overlay, so the window is faded out rather than hard-cropped. -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="960" height="1200" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- ── Ground ───────────────────────────────────────────── -->
  <rect width="960" height="1200" fill="url(#bg)"/>
  <rect width="960" height="1200" fill="url(#dots)"/>
  <rect width="960" height="1200" fill="url(#glowViolet)"/>
  <rect width="960" height="1200" fill="url(#glowCyan)"/>

  <!-- Constellation, echoing the hero canvas -->
  <g stroke="#a5b4fc" stroke-opacity="0.16" stroke-width="1.5" fill="none">
    <path d="M96 150 L242 96 L392 176 L300 292 Z"/>
    <path d="M660 92 L836 148 L788 300"/>
    <path d="M120 520 L48 640"/>
  </g>
  <g fill="#c7d2fe" fill-opacity="0.5">
    <circle cx="96" cy="150" r="3"/>
    <circle cx="242" cy="96" r="3.5"/>
    <circle cx="392" cy="176" r="3"/>
    <circle cx="300" cy="292" r="2.5"/>
    <circle cx="660" cy="92" r="3"/>
    <circle cx="836" cy="148" r="3.5"/>
    <circle cx="788" cy="300" r="3"/>
    <circle cx="120" cy="520" r="2.5"/>
  </g>

  <!-- ── Monogram portrait ────────────────────────────────── -->
  <circle cx="480" cy="352" r="300" fill="url(#orb)"/>
  <circle cx="480" cy="352" r="252" fill="none" stroke="url(#ringStroke)" stroke-width="1.5"/>
  <circle cx="480" cy="352" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <circle cx="480" cy="352" r="168" fill="#0f1226" fill-opacity="0.75"/>
  <circle cx="480" cy="352" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <text x="480" y="352" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="150" font-weight="700"
        letter-spacing="-5" fill="url(#mono)">AK</text>

  <!-- Orbit markers -->
  <circle cx="480" cy="100" r="7" fill="#a78bfa"/>
  <circle cx="732" cy="352" r="6" fill="#22d3ee"/>
  <circle cx="480" cy="604" r="5" fill="#818cf8" fill-opacity="0.8"/>

  <!-- ── Stack chips ──────────────────────────────────────── -->
  <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600">
    <g>
      <rect x="58" y="236" width="176" height="58" rx="29" fill="#141329" fill-opacity="0.92" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="92" cy="265" r="6" fill="#a78bfa"/>
      <text x="112" y="265" dominant-baseline="central" fill="#ddd6fe">TypeScript</text>
    </g>
    <g>
      <rect x="700" y="186" width="140" height="58" rx="29" fill="#141329" fill-opacity="0.92" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="734" cy="215" r="6" fill="#22d3ee"/>
      <text x="754" y="215" dominant-baseline="central" fill="#a5f3fc">React</text>
    </g>
    <g>
      <rect x="712" y="452" width="152" height="58" rx="29" fill="#141329" fill-opacity="0.92" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="746" cy="481" r="6" fill="#818cf8"/>
      <text x="766" y="481" dominant-baseline="central" fill="#c7d2fe">Node.js</text>
    </g>
    <g>
      <rect x="66" y="472" width="168" height="58" rx="29" fill="#141329" fill-opacity="0.92" stroke="#34d399" stroke-opacity="0.32" stroke-width="1.5"/>
      <circle cx="100" cy="501" r="6" fill="#34d399"/>
      <text x="120" y="501" dominant-baseline="central" fill="#a7f3d0">MongoDB</text>
    </g>
  </g>

  <!-- ── Editor window ────────────────────────────────────── -->
  <g mask="url(#fadeMask)">
    <rect x="76" y="660" width="808" height="452" rx="28" fill="url(#winBody)"
          stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

    <!-- Title bar -->
    <path d="M76 688 a28 28 0 0 1 28-28 h752 a28 28 0 0 1 28 28 v40 h-808 z" fill="#ffffff" fill-opacity="0.04"/>
    <line x1="76" y1="728" x2="884" y2="728" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="118" cy="694" r="8" fill="#f87171"/>
    <circle cx="146" cy="694" r="8" fill="#fbbf24"/>
    <circle cx="174" cy="694" r="8" fill="#34d399"/>
    <text x="212" y="695" dominant-baseline="central"
          font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="23" fill="#8b8fa3">ashish.ts</text>

    <!-- Code -->
    <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="26">
      <text x="118" y="790">
        <tspan fill="#a78bfa">const</tspan><tspan fill="#e4e4e7"> ashish </tspan><tspan fill="#8b8fa3">= {</tspan>
      </text>
      <text x="150" y="838">
        <tspan fill="#818cf8">stack</tspan><tspan fill="#8b8fa3">: </tspan><tspan fill="#67e8f9">"MERN · Next.js · TS"</tspan><tspan fill="#8b8fa3">,</tspan>
      </text>
      <text x="150" y="886">
        <tspan fill="#818cf8">focus</tspan><tspan fill="#8b8fa3">: </tspan><tspan fill="#67e8f9">"payments · DRM · realtime"</tspan><tspan fill="#8b8fa3">,</tspan>
      </text>
      <text x="150" y="934">
        <tspan fill="#818cf8">years</tspan><tspan fill="#8b8fa3">: </tspan><tspan fill="#fbbf24">3</tspan><tspan fill="#8b8fa3">,</tspan>
      </text>
      <text x="150" y="982">
        <tspan fill="#818cf8">ship</tspan><tspan fill="#8b8fa3">: (</tspan><tspan fill="#e4e4e7">idea</tspan><tspan fill="#8b8fa3">) </tspan><tspan fill="#a78bfa">=&gt;</tspan><tspan fill="#e4e4e7"> production</tspan><tspan fill="#8b8fa3">,</tspan>
      </text>
      <text x="118" y="1030" fill="#8b8fa3">}</text>
    </g>
  </g>
</svg>
