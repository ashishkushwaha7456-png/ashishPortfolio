name: Backend CI

on:
  push:
    branches:
      - feature/dev
  pull_request:
    branches:
      - feature/dev

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        
      - name: Type check
        run: npm run typecheck

      - name: Build backend
        run: npm run build